services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cautiousmemory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cautiousmemory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cautiousmemory} -d ${POSTGRES_DB:-cautiousmemory}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  cautiousmemory:
    image: ${CAUTIOUSMEMORY_IMAGE:-ruoji6/cautiousmemory}:${CAUTIOUSMEMORY_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      CAUTIOUSMEMORY_PG_DSN: postgres://${POSTGRES_USER:-cautiousmemory}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cautiousmemory}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CAUTIOUSMEMORY_LLM_PROVIDER: ${CAUTIOUSMEMORY_LLM_PROVIDER:-}
      CAUTIOUSMEMORY_LLM_MODEL: ${CAUTIOUSMEMORY_LLM_MODEL:-}
      CAUTIOUSMEMORY_LLM_BASE_URL: ${CAUTIOUSMEMORY_LLM_BASE_URL:-}
      CAUTIOUSMEMORY_LLM_PROXY: ${CAUTIOUSMEMORY_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the data directory (including jwt.key, SQLite, etc.) to data/ in the project root,
      # making it easy to inspect/backup on the host and preserving data across container rebuilds.
      - ./data:/app/data
      # Mount the project root skills directory into the container (overriding the built-in /app/skills in the image);
      # skill changes take effect without rebuilding the image because the container reads the host copy.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:

