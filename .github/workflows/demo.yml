name: deploy-demo

on:
  # A stable release published manually on the web; releases published by Actions are wired in through workflow_call.
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      commit:
        required: true
        type: string
    secrets:
      VERCEL_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the latest published stable release; leave blank to select the latest automatically"
        required: false
        type: string

permissions:
  contents: read

# Do not interrupt an upload already in progress; the selected release is checked before build and deployment to ensure it is still latest.
concurrency:
  group: demo-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      DEMO_URL: ${{ vars.DEMO_URL }}
      NEXT_PUBLIC_MOCK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Select a published, complete, latest release
        id: release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: latest } = await github.rest.repos.getLatestRelease({ owner, repo });
            const tag = process.env.REQUESTED_TAG || latest.tag_name;
            if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) {
              throw new Error('Only stable tags in vMAJOR.MINOR.PATCH format are allowed');
            }
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            if (release.draft || release.prerelease) throw new Error('Draft and prerelease versions cannot be deployed');
            const version = tag.slice(1);
            const assets = new Set(release.assets.map(asset => asset.name));
            for (const platform of ['linux-amd64', 'linux-arm64', 'darwin-amd64', 'darwin-arm64', 'windows-amd64']) {
              if (!assets.has(`artex-${version}-${platform}.zip`)) throw new Error(`Missing release archive for ${platform}`);
            }
            if (!assets.has('SHA256SUMS')) throw new Error('Missing release checksum file');
            core.setOutput('tag', tag);
            core.setOutput('current', String(tag === latest.tag_name));
            if (tag !== latest.tag_name) {
              core.notice(`${tag} has been superseded by ${latest.tag_name}; skipping to avoid overwriting the newer Demo`);
            }

      - name: Check deployment configuration
        if: steps.release.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          for name in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN DEMO_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name in the repository Actions settings first; see the README for online Demo deployment instructions"
              exit 1
            fi
          done
          if [[ ! "$DEMO_URL" =~ ^https://[a-zA-Z0-9][a-zA-Z0-9.-]+/?$ ]]; then
            echo "::error::DEMO_URL must be an HTTPS production domain without a path, query parameters, or credentials"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.release.outputs.current == 'true'
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Verify the released commit and write deployment metadata
        if: steps.release.outputs.current == 'true'
        env:
          EXPECTED_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          commit=$(git rev-parse HEAD)
          if [ -n "$EXPECTED_COMMIT" ] && [ "$commit" != "$EXPECTED_COMMIT" ]; then
            echo "::error::The release tag has moved; refusing to deploy a commit different from the one used to build the Release"
            exit 1
          fi
          mkdir -p web/public
          jq -n --arg tag "$RELEASE_TAG" --arg commit "$commit" \
            --arg release "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
            '{tag: $tag, commit: $commit, release: $release, mock: true}' > web/public/demo-version.json
          # Support historical stable releases that do not yet include this configuration on first deployment; CLI deployments are unaffected by this setting.
          jq -n '{"$schema":"https://openapi.vercel.sh/vercel.json", framework:"nextjs", installCommand:"npm ci", buildCommand:"npm run build", git:{deploymentEnabled:false}}' > web/vercel.json

      - uses: actions/setup-node@v4
        if: steps.release.outputs.current == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        if: steps.release.outputs.current == 'true'
        run: npm install --global vercel@64.2.0

      - name: Configure the dedicated demo project
        if: steps.release.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # The CLI uses web/ as the project root; set the same Node major version as the runner.
          curl --fail-with-body --silent --show-error --request PATCH \
            --header "Authorization: Bearer $VERCEL_TOKEN" --header 'Content-Type: application/json' \
            --data '{"framework":"nextjs","nodeVersion":"22.x","rootDirectory":null,"installCommand":"npm ci","buildCommand":"npm run build"}' \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            --output /tmp/demo-project.json
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" --header 'Content-Type: application/json' \
            --data '{"key":"NEXT_PUBLIC_MOCK","value":"1","type":"plain","target":["production"]}' \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?teamId=$VERCEL_ORG_ID&upsert=true" \
            --output /tmp/demo-env.json
          jq -e '(.failed // []) | length == 0' /tmp/demo-env.json
          # The project token cannot call the user-information endpoint required by the CLI alias, so configure the project domain directly.
          # Once the domain is linked to the project, --prod automatically updates it with each deployment.
          domain="${DEMO_URL#https://}"
          domain="${domain%/}"
          status=$(curl --silent --show-error --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains/$domain?teamId=$VERCEL_ORG_ID" \
            --output /tmp/demo-domain.json)
          if [ "$status" = "404" ]; then
            jq -n --arg name "$domain" '{name:$name}' > /tmp/demo-domain-input.json
            curl --fail-with-body --silent --show-error --request POST \
              --header "Authorization: Bearer $VERCEL_TOKEN" --header 'Content-Type: application/json' \
              --data-binary @/tmp/demo-domain-input.json \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_ORG_ID" \
              --output /tmp/demo-domain.json
          elif [ "$status" != "200" ]; then
            jq '.error' /tmp/demo-domain.json
            exit 1
          fi
          jq -e --arg domain "$domain" '.name == $domain and .verified == true' /tmp/demo-domain.json

      - name: Pull production project settings
        if: steps.release.outputs.current == 'true'
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build the mock demo
        if: steps.release.outputs.current == 'true'
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Check latest release again before publishing
        if: steps.release.outputs.current == 'true'
        id: publish
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const { data: latest } = await github.rest.repos.getLatestRelease(context.repo);
            const current = latest.tag_name === process.env.RELEASE_TAG;
            core.setOutput('current', String(current));
            if (!current) core.notice('A newer stable release was published during the build; keeping the live version until the newer release is deployed');

      - name: Deploy the prebuilt demo to production
        if: steps.publish.outputs.current == 'true'
        id: deploy
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Demo deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stable release: ${{ steps.release.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Stable URL: $DEMO_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment URL: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production version metadata
        if: steps.publish.outputs.current == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          # Check the public production domain; Vercel can separately protect random deployment-specific domains.
          # An HTTP-success response may still serve the old version temporarily, so retry both the request and content validation together.
          expected_commit=$(git rev-parse HEAD)
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          deadline=$((SECONDS + 120))
          for attempt in $(seq 1 24); do
            remaining=$((deadline - SECONDS))
            if [ "$remaining" -le 0 ]; then
              break
            fi
            request_timeout=$((remaining < 10 ? remaining : 10))
            rm -f "$response"
            if curl --fail-with-body --silent --show-error --connect-timeout 5 --max-time "$request_timeout" \
              --header 'Cache-Control: no-cache' \
              "${DEMO_URL%/}/demo-version.json?verify=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" \
              -o "$response" && \
              jq -e --arg tag "$RELEASE_TAG" --arg commit "$expected_commit" \
                '.tag == $tag and .commit == $commit and .mock == true' "$response" > /dev/null; then
              echo "Demo version verified: $RELEASE_TAG ($expected_commit)"
              exit 0
            fi
            echo "::notice::Demo version is not ready yet (attempt $attempt/24); waiting for the production domain to sync"
            remaining=$((deadline - SECONDS))
            if [ "$attempt" -lt 24 ] && [ "$remaining" -gt 0 ]; then
              sleep "$((remaining < 5 ? remaining : 5))"
            fi
          done
          echo "::error::Demo version verification failed; expected $RELEASE_TAG ($expected_commit), mock=true. Last response follows"
          if [ -f "$response" ]; then
            cat "$response"
          fi
          exit 1
